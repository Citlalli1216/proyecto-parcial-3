
<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f4f9;
      padding: 25px;
    }

    .contenedor {
      background: white;
      padding: 25px;
      border-radius: 12px;
      max-width: 400px;
      margin: auto;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      box-sizing: border-box;
    }

    button {
      background: #3267a8;
      color: white;
      border: none;
      border-radius: 6px;
    }

    #mensaje {
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <h2>Registro del dólar</h2>
    <p>Ingresa los datos del día.</p>

    <label>Número de día</label>
    <input type="number" id="dia" min="1" step="1"
      placeholder="Ejemplo: 1">

    <label>Valor del dólar</label>
    <input type="number" id="valor" min="0.01"
      step="0.01" placeholder="Ejemplo: 17.99">

    <button onclick="guardar()">Guardar registro</button>

    <p id="mensaje"></p>
  </div>

  <script>
    function guardar() {
      const dia = document.getElementById('dia').value;
      const valor = document.getElementById('valor').value;
      const mensaje = document.getElementById('mensaje');

      if (!dia || !valor) {
        mensaje.textContent = 'Completa los dos datos.';
        return;
      }

      mensaje.textContent = 'Guardando...';

      google.script.run
        .withSuccessHandler(function(respuesta) {
          mensaje.textContent = respuesta;
          document.getElementById('dia').value = '';
          document.getElementById('valor').value = '';
        })
        .withFailureHandler(function(error) {
          mensaje.textContent = error.message;
        })
        .guardarRegistro(dia, valor);
    }
  </script>
</body>
</html>
